<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiki — Music Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="salon">

    <!-- ═══ AMBIENT BACKGROUND ═══ -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="vignette"></div>
    </div>

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar">
        <div class="brand-block">
            <div class="brand-mark">
                <svg viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="0.8"/>
                    <circle cx="16" cy="16" r="9" stroke="currentColor" stroke-width="0.5" opacity="0.7"/>
                    <circle cx="16" cy="16" r="5" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
                    <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
                </svg>
            </div>
            <div class="brand-text">
                <div class="brand-name">Kiki</div>
                <div class="brand-tagline">Music Room</div>
            </div>
        </div>

        <div class="sidebar-content">
            <div class="section-label">Your Music</div>

            <!-- Upload local files -->
            <label class="upload-card" for="sidebarFiles">
                <div class="upload-icon">
                    <svg viewBox="0 0 20 20" fill="none" width="20" height="20">
                        <path d="M10 13V4M6.5 7.5L10 4l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 14v1.5A1.5 1.5 0 004.5 17h11a1.5 1.5 0 001.5-1.5V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="upload-card-text">
                    <span class="upload-card-title">Upload Music Files</span>
                    <span class="upload-card-hint">MP3 · FLAC · WAV · AAC</span>
                </div>
                <input type="file" id="sidebarFiles" accept="audio/*" multiple/>
            </label>

        </div>

        <!-- Track list -->
        <div class="track-list-section">
            <div class="track-list-header">
                <span class="section-label" style="margin-bottom:0">Playlist</span>
                <span class="track-count" id="trackCount"></span>
            </div>
            <div class="track-list" id="trackList">
                <div class="track-empty">Upload songs to begin</div>
            </div>
        </div>
    </aside>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main">
        <!-- Top bar -->
        <div class="top-bar">
            <div class="top-greeting">
                <span class="greeting-time" id="greetingTime">Happy Birthday</span>
                <span class="greeting-sub">Your vinyl is ready. Enjoy brother.</span>
            </div>
            <button class="immersive-btn" id="immersiveBtn" title="Immersive view">
                <svg viewBox="0 0 20 20" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
                    <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/>
                </svg>
            </button>
        </div>

        <!-- Exit immersive floating button -->
        <button class="exit-immersive-btn" id="exitImmersiveBtn" title="Exit immersive">
            <svg viewBox="0 0 20 20" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M7 3H3v4M3 3l5 5M13 3h4v4M17 3l-5 5M7 17H3v-4M3 17l5-5M13 17h4v-4M17 17l-5-5"/>
            </svg>
        </button>

        <!-- ━━━ Hero Stage — Turntable as the focus ━━━ -->
        <section class="hero-stage">
            <div class="stage-glow"></div>

            <div class="cabinet-wrap">
                <div class="cabinet">
                    <div class="cabinet-top-trim"></div>

                    <div class="cabinet-face">
                        <div class="brand-badge">
                            <span class="badge-model">AR-41 MAY012026 ⋅ STUDIO</span>
                        </div>

                        <!-- Platter -->
                        <div class="platter-zone">
                            <div class="platter-shadow"></div>
                            <div class="platter">
                                <div class="platter-rings">
                                    <div class="pr pr1"></div>
                                    <div class="pr pr2"></div>
                                    <div class="pr pr3"></div>
                                    <div class="pr pr4"></div>
                                </div>
                                <div class="strobe-dots"></div>

                                <div class="record" id="record">
                                    <svg class="grooves-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <radialGradient id="recGrad" cx="50%" cy="50%" r="50%">
                                                <stop offset="0%" stop-color="#1a1a1a"/>
                                                <stop offset="100%" stop-color="#0a0a0a"/>
                                            </radialGradient>
                                        </defs>
                                        <circle cx="150" cy="150" r="149" fill="url(#recGrad)"/>
                                        <g stroke="rgba(255,255,255,0.04)" fill="none">
                                            <circle cx="150" cy="150" r="146" stroke-width="0.6"/>
                                            <circle cx="150" cy="150" r="142" stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="138" stroke-width="0.7"/>
                                            <circle cx="150" cy="150" r="133" stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="128" stroke-width="0.6"/>
                                            <circle cx="150" cy="150" r="123" stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="118" stroke-width="0.7"/>
                                            <circle cx="150" cy="150" r="113" stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="108" stroke-width="0.6"/>
                                            <circle cx="150" cy="150" r="103" stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="98"  stroke-width="0.7"/>
                                            <circle cx="150" cy="150" r="93"  stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="88"  stroke-width="0.6"/>
                                            <circle cx="150" cy="150" r="83"  stroke-width="0.5"/>
                                            <circle cx="150" cy="150" r="78"  stroke-width="0.6"/>
                                        </g>
                                        <ellipse cx="115" cy="105" rx="90" ry="50" fill="rgba(255,255,255,0.025)" transform="rotate(-25 150 150)"/>
                                        <ellipse cx="195" cy="200" rx="50" ry="25" fill="rgba(255,255,255,0.015)" transform="rotate(20 150 150)"/>
                                    </svg>
                                    <div class="label-disc" id="labelDisc">
                                        <div class="label-arc-text">★ AUDIÓ RECORDS ★</div>
                                        <div class="label-content">
                                            <div class="label-artist" id="labelArtist">—</div>
                                            <div class="label-divider"></div>
                                            <div class="label-album" id="labelAlbum"></div>
                                        </div>
                                        <div class="label-spindle"></div>
                                    </div>
                                </div>
                                <div class="spindle-pin"></div>
                            </div>

                            <!-- Tonearm rest cradle -->
                            <div class="tonearm-rest"></div>

                            <!-- Tonearm assembly — entire zone is clickable -->
                            <div class="tonearm-assembly" id="tonearmAssembly">
                                <div class="tonearm-base-mount">
                                    <div class="cw-shaft"></div>
                                    <div class="counterweight">
                                        <div class="cw-knurl"></div>
                                    </div>
                                </div>
                                <div class="tonearm-pivot">
                                    <div class="pivot-base"></div>
                                    <div class="tonearm" id="tonearm">
                                        <svg class="arm-svg" viewBox="-30 -2 62 242" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                                            <defs>
                                                <!-- Anthracite cylinder — lit from upper-right, dark charcoal like Sony photo -->
                                                <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                                    <stop offset="0%"   stop-color="#141414"/>
                                                    <stop offset="18%"  stop-color="#0d0d0d"/>
                                                    <stop offset="42%"  stop-color="#070707"/>
                                                    <stop offset="65%"  stop-color="#111111"/>
                                                    <stop offset="82%"  stop-color="#1d1d1d"/>
                                                    <stop offset="100%" stop-color="#2a2a2a"/>
                                                </linearGradient>
                                                <!-- Headshell plate — flat top-lit anthracite -->
                                                <linearGradient id="hsPlateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                                    <stop offset="0%"   stop-color="#222222"/>
                                                    <stop offset="35%"  stop-color="#141414"/>
                                                    <stop offset="100%" stop-color="#070707"/>
                                                </linearGradient>
                                                <!-- Cartridge body gradient -->
                                                <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                                    <stop offset="0%"   stop-color="#1a1a1a"/>
                                                    <stop offset="100%" stop-color="#080808"/>
                                                </linearGradient>
                                            </defs>

                                            <!-- Cast shadow under arm -->
                                            <path d="M 3,6 C 8,46 11,92 8,137 C 5,164 -7,179 -9,200"
                                                  fill="none" stroke="rgba(0,0,0,0.38)" stroke-width="18" stroke-linecap="round"/>

                                            <!-- ── MAIN ARM TUBE — thick anthracite cylinder ── -->
                                            <path d="M 0,0 C 5,40 8,86 5,131 C 2,158 -9,173 -11,193"
                                                  fill="none" stroke="url(#armGrad)" stroke-width="10" stroke-linecap="round"/>

                                            <!-- Broad ambient highlight (right face of cylinder) -->
                                            <path d="M 3,0 C 8,40 11,86 8,131 C 5,158 -6,173 -8,193"
                                                  fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4.5" stroke-linecap="round"/>

                                            <!-- Sharp specular line (top right edge) -->
                                            <path d="M 4.5,0 C 9.5,40 12.5,86 9.5,131 C 6.5,158 -4.5,173 -6.5,193"
                                                  fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.3" stroke-linecap="round"/>

                                            <!-- Bottom edge shadow (left face, underside) -->
                                            <path d="M -4.5,0 C 0.5,40 3.5,86 0.5,131 C -2.5,158 -13.5,173 -15.5,193"
                                                  fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1.8" stroke-linecap="round"/>

                                            <!-- ── WRIST / NECK CONNECTOR ── -->
                                            <!-- Thick bent neck where arm meets headshell (S-curve kink) -->
                                            <path d="M -11,194 C -11,198 -14,200 -18,200 L -29,200"
                                                  fill="none" stroke="#181818" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                                            <!-- Neck top specular -->
                                            <path d="M -10,193 C -10,197 -13,199 -17,199 L -28,199"
                                                  fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round"/>
                                            <!-- Neck bottom shadow -->
                                            <path d="M -12,195 C -12,199 -15,201 -19,201 L -30,201"
                                                  fill="none" stroke="rgba(0,0,0,0.32)" stroke-width="1.2" stroke-linecap="round"/>

                                            <!-- ── HEADSHELL — rectangular angular plate ── -->
                                            <!-- Main plate body -->
                                            <rect x="-31" y="196" width="24" height="13" rx="1.5" fill="url(#hsPlateGrad)"/>
                                            <!-- Top lit surface -->
                                            <rect x="-31" y="196" width="24" height="3.5" rx="1" fill="rgba(255,255,255,0.10)"/>
                                            <!-- Left face (edge facing record, slightly lit) -->
                                            <rect x="-31" y="196" width="2" height="13" rx="0.5" fill="rgba(255,255,255,0.07)"/>
                                            <!-- Right connector shadow -->
                                            <rect x="-9" y="196" width="2" height="13" fill="rgba(0,0,0,0.30)"/>
                                            <!-- Bottom undercut (shadow ridge beneath plate) -->
                                            <rect x="-31" y="206.5" width="24" height="2.5" rx="1" fill="rgba(0,0,0,0.55)"/>

                                            <!-- Cartridge mounting screws — 2 bolt heads visible -->
                                            <circle cx="-26" cy="200.5" r="1.8" fill="#050505" stroke="rgba(255,255,255,0.20)" stroke-width="0.7"/>
                                            <line x1="-26" y1="199.2" x2="-26" y2="201.8" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
                                            <circle cx="-14" cy="200.5" r="1.8" fill="#050505" stroke="rgba(255,255,255,0.20)" stroke-width="0.7"/>
                                            <line x1="-14" y1="199.2" x2="-14" y2="201.8" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>

                                            <!-- ── CARTRIDGE BODY — sits below headshell ── -->
                                            <rect x="-29" y="209" width="18" height="11" rx="2" fill="url(#cartGrad)"/>
                                            <!-- Cartridge top rim (tiny highlight) -->
                                            <rect x="-29" y="209" width="18" height="2.5" rx="1" fill="rgba(255,255,255,0.05)"/>
                                            <!-- Cartridge groove lines (body detail) -->
                                            <line x1="-28.5" y1="213" x2="-12.5" y2="213" stroke="rgba(0,0,0,0.45)" stroke-width="0.8"/>
                                            <line x1="-28.5" y1="216" x2="-12.5" y2="216" stroke="rgba(0,0,0,0.30)" stroke-width="0.6"/>
                                            <!-- Left side panel edge -->
                                            <rect x="-29" y="209" width="1.2" height="11" rx="0.5" fill="rgba(255,255,255,0.04)"/>

                                            <!-- ── CANTILEVER — thin wire from cartridge ── -->
                                            <line x1="-20" y1="220" x2="-20" y2="228"
                                                  stroke="#aaaaaa" stroke-width="1.1" stroke-linecap="round"/>
                                            <!-- Cantilever suspension rubber -->
                                            <ellipse cx="-20" cy="221" rx="2" ry="1.5" fill="#1a1a1a" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

                                            <!-- ── STYLUS — diamond tip ── -->
                                            <!-- Tip body (tiny teardrop shape) -->
                                            <path d="M -22,230 Q -20,224 -18,230 Q -20,234 -22,230 Z"
                                                  fill="rgba(230,235,245,0.92)"/>
                                            <!-- Specular on stylus -->
                                            <ellipse cx="-20.5" cy="228" rx="0.8" ry="1.2" fill="rgba(255,255,255,0.65)"/>
                                            <!-- Diamond tip point -->
                                            <circle cx="-20" cy="232" r="0.9" fill="rgba(200,215,235,0.95)"/>

                                            <!-- Wide transparent hit zone -->
                                            <rect x="-30" y="-2" width="62" height="242" fill="transparent" style="cursor:pointer"/>
                                        </svg>
                                    </div>
                                    <div class="pivot-cap"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Cabinet controls — Speed · Power -->
                        <div class="cabinet-controls">
                            <div class="speed-cluster">
                                <span class="ctrl-label">SPEED</span>
                                <div class="speed-pills">
                                    <button class="speed-pill active" data-speed="33">33<sup>⅓</sup></button>
                                    <button class="speed-pill" data-speed="45">45</button>
                                </div>
                            </div>

                            <div class="ctrl-group">
                                <div class="motor-status" id="motorStatus"></div>
                                <button class="power-btn" id="powerBtn" title="Power">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                                        <line x1="12" y1="2" x2="12" y2="12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="cabinet-bottom-trim"></div>
                </div>

                <div class="cabinet-feet">
                    <div class="foot"></div>
                    <div class="foot"></div>
                </div>
            </div>
        </section>

        <div style="height: 16px;"></div>
    </main>

    <!-- ═══ TRANSPORT BAR ═══ -->
    <footer class="transport-bar">
        <div class="tb-now-playing">
            <div class="tb-art" id="tbArt">
                <div class="tb-art-empty">
                    <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
                        <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
                        <circle cx="12" cy="12" r="4" stroke="rgba(255,255,255,0.1)" stroke-width="0.6"/>
                        <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.25)"/>
                    </svg>
                </div>
            </div>
            <div class="tb-info">
                <div class="tb-track" id="tbTrack">No record loaded</div>
                <div class="tb-artist" id="tbArtist">Kiki</div>
            </div>
        </div>

        <div class="tb-controls">
            <div class="tb-buttons">
                <button class="tb-btn tb-btn-sm" id="prevBtn" title="Previous">
                    <svg viewBox="0 0 16 16" fill="currentColor">
                        <rect x="2" y="3" width="1.5" height="10"/>
                        <polygon points="14,3 5,8 14,13"/>
                    </svg>
                </button>
                <button class="tb-btn tb-btn-play" id="playBtn" title="Play">
                    <svg viewBox="0 0 16 16" fill="currentColor" id="playIcon">
                        <polygon points="4,2 14,8 4,14"/>
                    </svg>
                    <svg viewBox="0 0 16 16" fill="currentColor" id="pauseIcon" style="display:none">
                        <rect x="3" y="2" width="3.5" height="12"/>
                        <rect x="9.5" y="2" width="3.5" height="12"/>
                    </svg>
                </button>
                <button class="tb-btn tb-btn-sm" id="nextBtn" title="Next">
                    <svg viewBox="0 0 16 16" fill="currentColor">
                        <polygon points="2,3 11,8 2,13"/>
                        <rect x="12.5" y="3" width="1.5" height="10"/>
                    </svg>
                </button>
            </div>
            <div class="tb-progress">
                <span class="tb-time" id="currentTime">0:00</span>
                <div class="tb-progress-bar" id="progressTrack">
                    <div class="tb-progress-fill" id="progressFill"></div>
                    <div class="tb-progress-head" id="progressHead"></div>
                </div>
                <span class="tb-time" id="totalTime">0:00</span>
            </div>
        </div>

        <div class="tb-extras">
            <button class="tb-icon-btn" id="crackleToggle" title="Vinyl crackle" data-on="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
                    <circle cx="8" cy="8" r="6"/>
                    <circle cx="5" cy="6" r="0.5" fill="currentColor"/>
                    <circle cx="10" cy="9" r="0.5" fill="currentColor"/>
                    <circle cx="7" cy="11" r="0.5" fill="currentColor"/>
                    <circle cx="11" cy="5" r="0.5" fill="currentColor"/>
                </svg>
            </button>
            <div class="tb-volume">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
                    <polygon points="2,5 5,5 8,2 8,14 5,11 2,11" fill="currentColor"/>
                    <path d="M11 5.5c1 .8 1 4.2 0 5"/>
                    <path d="M13 3.5c2 1.6 2 7.4 0 9"/>
                </svg>
                <input type="range" min="0" max="100" value="70" id="volumeSlider"/>
            </div>
        </div>
    </footer>

    <!-- ═══ ADD FORM MODAL ═══ -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add to Your Collection</h3>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="form-row">
                <label>Artist</label>
                <input type="text" id="inputArtist" placeholder="e.g. Nina Simone" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>Album</label>
                <input type="text" id="inputAlbum" placeholder="e.g. Wild Is the Wind" autocomplete="off"/>
            </div>
            <div class="form-row">
                <label>Cover palette</label>
                <div class="color-swatches" id="colorSwatches">
                    <div class="swatch active" data-color="#8b3a3a" style="background:#8b3a3a"></div>
                    <div class="swatch" data-color="#a0552c" style="background:#a0552c"></div>
                    <div class="swatch" data-color="#c4953a" style="background:#c4953a"></div>
                    <div class="swatch" data-color="#3d5a4a" style="background:#3d5a4a"></div>
                    <div class="swatch" data-color="#2c4858" style="background:#2c4858"></div>
                    <div class="swatch" data-color="#5a3d6a" style="background:#5a3d6a"></div>
                    <div class="swatch" data-color="#6b4226" style="background:#6b4226"></div>
                    <div class="swatch" data-color="#1f2a36" style="background:#1f2a36"></div>
                    <input type="color" id="customColor" value="#8b3a3a" title="Pick custom"/>
                </div>
            </div>
            <div class="form-row">
                <label>Tracks</label>
                <label class="file-drop" id="fileDrop">
                    <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
                        <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.3"/>
                        <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.3"/>
                    </svg>
                    <span id="fileLabel">Choose audio files from your computer</span>
                    <input type="file" id="inputFiles" accept="audio/*" multiple/>
                </label>
            </div>
            <div class="form-actions">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-save" id="saveBtn">Add to Collection</button>
            </div>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
