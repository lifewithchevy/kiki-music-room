<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="cab" cx="34%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#9c3232"/>
      <stop offset="55%" stop-color="#7a1616"/>
      <stop offset="100%" stop-color="#490d0d"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="68%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="label" cx="40%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#6f8f5d"/>
      <stop offset="100%" stop-color="#3a5a3a"/>
    </radialGradient>
    <linearGradient id="arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6ad"/>
      <stop offset="100%" stop-color="#d4b258"/>
    </linearGradient>
    <radialGradient id="sheen" cx="38%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed cabinet (iOS masks the corners) -->
  <rect width="1024" height="1024" fill="url(#cab)"/>

  <!-- vinyl record -->
  <circle cx="455" cy="520" r="362" fill="url(#vinyl)"/>
  <g stroke="#272727" stroke-width="2" fill="none" opacity="0.7">
    <circle cx="455" cy="520" r="322"/>
    <circle cx="455" cy="520" r="284"/>
    <circle cx="455" cy="520" r="246"/>
    <circle cx="455" cy="520" r="208"/>
  </g>
  <circle cx="455" cy="520" r="362" fill="url(#sheen)"/>

  <!-- label -->
  <circle cx="455" cy="520" r="158" fill="url(#label)"/>
  <circle cx="455" cy="520" r="15" fill="#ece9da"/>

  <!-- tonearm -->
  <circle cx="800" cy="250" r="46" fill="#241b13"/>
  <circle cx="800" cy="250" r="21" fill="#3a2c1e"/>
  <path d="M 800 250 C 724 408, 690 516, 626 628" fill="none" stroke="url(#arm)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 626 628 l -36 30 -24 28" fill="none" stroke="#161616" stroke-width="18" stroke-linecap="round"/>
</svg>
